[project]
name = "agent-dev-skills"
version = "0.1.0"
description = "Claude Code skills for engineering work, starting with review-loop: PR review with verified findings"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # 1.x is the documented, settled line; 2.0 shipped 2026-10-21 and is not adopted yet.
    "anthropic>=1.15,<2",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
review-loop = "review_loop.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0", "mypy>=1.13.0", "types-pyyaml>=6.0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_loop"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
