name: review-loop
description: Review a pull request with verified findings, and re-review new commits.

inputs:
  anthropic-api-key:
    description: Anthropic API key, from a repository secret.
    required: true
  github-token:
    description: Token that can read the PR and post reviews (pull-requests: write).
    default: ${{ github.token }}
  profile:
    description: dev (Claude Haiku 5.5, cheap) or report (Claude Opus 5.5).
    default: dev

runs:
  using: composite
  steps:
    # This job can write to pull requests, so the third-party action is pinned to a commit
    # (astral-sh/setup-uv v10.3.2) rather than a tag that could be moved.
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        working-directory: ${{ github.action_path }}
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_LOOP_PROFILE: ${{ inputs.profile }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: uv run --project "$ACTION_PATH" review-loop pr --repo "$REPO" --pr "$PR" --post
